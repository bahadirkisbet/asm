[package]
name = "agentic-secret-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Secret capture and delivery for agents, without plaintext tool responses"
license = "MIT"
repository = "https://github.com/bahadirkisbet/asm"

[[bin]]
name = "asm"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
getrandom = "0.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rmcp = { version = "3.9", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tungstenite = "0.30"
url = "2"
zeroize = "1"

[profile.release]
strip = true
lto = "thin"
